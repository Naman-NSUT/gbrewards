name: admin-web-ci

on:
  push:
    paths: ["admin-web/**", ".github/workflows/admin-web-ci.yml"]
  pull_request:
    paths: ["admin-web/**", ".github/workflows/admin-web-ci.yml"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      # E2E (Playwright) needs a running backend + browsers; run it in a dedicated
      # job/stage against staging — see admin-web/README.md.
