name: backend-ci

on:
  push:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scanrewards
          POSTGRES_PASSWORD: scanrewards
          POSTGRES_DB: scanrewards
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scanrewards"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://scanrewards:scanrewards@localhost:5432/scanrewards
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-please-change-in-prod
      ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85
