# Render blueprint — backend API + managed Postgres + Key Value (Redis).
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Then set the sync:false secrets (CORS_ORIGINS, MSG91_*, SENTRY_DSN) in the dashboard.
services:
  - type: web
    name: gbrewards-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/v1/healthz
    autoDeploy: true
    envVars:
      - key: ENV
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gbrewards-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gbrewards-redis
          property: connectionString
      - key: OTP_PROVIDER
        value: msg91
      - key: CORS_ORIGINS
        sync: false # e.g. https://admin.yourdomain.com
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_SENDER_ID
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: keyvalue
    name: gbrewards-redis
    plan: free
    ipAllowList: [] # only reachable from within the Render private network
    maxmemoryPolicy: noeviction

databases:
  - name: gbrewards-db
    plan: basic-256mb # upgrade for daily backups / PITR (balances are money-adjacent)
    postgresMajorVersion: "16"
